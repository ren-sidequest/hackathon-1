name: Backend checks
on:
  pull_request:
    paths: ['app/backend/**', 'docs/backend/**', 'app/shared/api4-types.ts', 'scripts/frontend-types-v4.py', '.github/workflows/backend-checks.yml']
  push:
    branches: [main]
    paths: ['app/backend/**', 'docs/backend/**', 'app/shared/api4-types.ts', 'scripts/frontend-types-v4.py', '.github/workflows/backend-checks.yml']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run docs:generate:legacy
      - run: npm run docs:generate
      - run: git diff --exit-code -- ../../docs/backend/openapi.json ../../docs/backend/r5/openapi.json ../../docs/backend/r6/openapi.json
      - run: python3 ../../scripts/frontend-types-v4.py --check
      - run: node content/r6/generate-audit.mjs --check
      - run: node scripts/verify-r6.mjs
