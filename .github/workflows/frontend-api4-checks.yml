name: API4 frontend integration
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api4:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Exercise this PR's actual frontend/backend tree, not an older pin.
      EB_API4_BACKEND_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            app/candidate/package-lock.json
            app/hr/package-lock.json
            app/backend/package-lock.json
      - run: npm ci --prefix app/candidate
      - run: npm ci --prefix app/hr
      - run: npm ci --prefix app/backend
      - run: npm run docs:generate --prefix app/backend
      - run: git diff --exit-code -- docs/backend/r6/openapi.json
      - run: python3 scripts/frontend-types-v4.py --check
      - run: npm test --prefix app/candidate
      - run: npm run build --prefix app/candidate
      - run: npm run build --prefix app/hr
      - run: npx playwright install --with-deps chromium
        working-directory: app/candidate
      - run: npm run test:api4 --prefix app/candidate
