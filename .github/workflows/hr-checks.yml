name: HR application checks

on:
  pull_request:
    paths:
      - 'app/hr/**'
      - 'app/shared/**'
      - '.github/workflows/hr-checks.yml'
  push:
    branches: [main]
    paths:
      - 'app/hr/**'
      - 'app/shared/**'
      - '.github/workflows/hr-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hr-app:
    name: HR workflow tests and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app/hr
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/hr/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
